<!DOCTYPE html>

<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{layoutTitle}">PetClinic</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/app.css}" />
  <script th:src="@{/resources/js/app.js}" defer></script>
</head>

<body>
  <a class="skip-link" href="#main-content" th:text="#{skipToContent}">Skip to content</a>

  <header class="app-header">
    <nav class="navbar navbar-expand-lg" th:aria-label="#{primaryNavigation}">
      <div class="container app-nav-container">
        <a class="navbar-brand" th:href="@{/}" th:aria-label="#{petClinicHome}">
          <span class="brand-mark" aria-hidden="true"><i class="fa fa-paw"></i></span>
          <span class="brand-copy"><strong>PetClinic</strong><small th:text="#{brandTagline}">Care, organized.</small></span>
        </a>
        <div class="nav-actions">
          <button class="theme-toggle" id="theme-toggle" type="button" th:aria-label="#{toggleTheme}"
            th:data-light-label="#{useLightTheme}" th:data-dark-label="#{useDarkTheme}" aria-pressed="false">
            <i class="fa fa-sun-o theme-icon-light" aria-hidden="true"></i>
            <i class="fa fa-moon-o theme-icon-dark" aria-hidden="true"></i>
          </button>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
            aria-controls="main-navbar" aria-expanded="false" th:aria-label="#{toggleNavigation}">
            <span class="navbar-toggler-icon"><i class="fa fa-bars" aria-hidden="true"></i></span>
          </button>
        </div>
        <div class="collapse navbar-collapse" id="main-navbar">
          <ul class="navbar-nav me-auto" th:remove="all">
            <li th:fragment="menuItem (link,active,title,glyph,text)" class="nav-item">
              <a th:class="${active==menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}"
                th:title="${title}" th:aria-current="${active==menu ? 'page' : null}">
                <span th:class="'fa fa-'+${glyph}" aria-hidden="true"></span><span th:text="${text}">Template</span>
              </a>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto app-nav-links">
            <li th:replace="~{::menuItem ('/','home',#{home},'home',#{home})}"></li>
            <li th:replace="~{::menuItem ('/owners/find','owners',#{findOwners},'search',#{findOwners})}"></li>
            <li th:replace="~{::menuItem ('/vets.html','vets',#{vets},'user-md',#{vets})}"></li>
            <li th:replace="~{::menuItem ('/oups','error',#{error},'exclamation-circle',#{error})}"></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content" class="app-main" tabindex="-1">
    <div class="container app-container"><th:block th:insert="${template}" /></div>
  </main>

  <footer class="app-footer">
    <div class="container footer-inner">
      <div class="footer-brand"><span class="brand-mark brand-mark-small" aria-hidden="true"><i class="fa fa-paw"></i></span><span th:text="#{footerMessage}">Thoughtful care for every companion.</span></div>
      <img th:src="@{/resources/images/spring-logo.svg}" th:alt="#{springLogoAlt}" class="spring-logo">
    </div>
  </footer>
  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
