<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">
<body><form><th:block th:fragment="input (label, name, type)"><div th:with="valid=${!#fields.hasErrors(name)}" th:class="${'field-group' + (valid ? '' : ' has-error')}"><div class="floating-field"><input class="form-control" th:type="${type}" th:field="*{__${name}__}" placeholder=" " th:min="${type == 'date' ? minVisitDate : null}" th:aria-invalid="${!valid}" th:aria-describedby="${!valid ? name + '-error' : null}" /><label th:for="${name}" th:text="${label}">Label</label><i th:if="${valid}" class="fa fa-check field-status" aria-hidden="true"></i><i th:if="${!valid}" class="fa fa-exclamation-circle field-status" aria-hidden="true"></i></div><span th:if="${!valid}" th:id="${name + '-error'}" class="field-error" th:errors="*{__${name}__}" th:text="#{error}" role="alert">Error</span></div></th:block></form></body>
</html>
