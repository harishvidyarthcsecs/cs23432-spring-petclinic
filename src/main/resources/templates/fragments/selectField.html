<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">
<body><form><th:block th:fragment="select (label, name, items)"><div th:with="valid=${!#fields.hasErrors(name)}" th:class="${'field-group' + (valid ? '' : ' has-error')}"><div class="floating-field select-field"><select class="form-select" th:field="*{__${name}__}" th:aria-invalid="${!valid}" th:aria-describedby="${!valid ? name + '-error' : null}"><option th:each="item : ${items}" th:value="${item}" th:text="${item}">Item</option></select><label th:for="${name}" th:text="${label}">Label</label></div><span th:if="${!valid}" th:id="${name + '-error'}" class="field-error" th:errors="*{__${name}__}" th:text="#{error}" role="alert">Error</span></div></th:block></form></body>
</html>
