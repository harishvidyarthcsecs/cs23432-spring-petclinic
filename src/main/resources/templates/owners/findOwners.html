<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>
  <div class="page-heading page-heading-split">
    <div><span class="eyebrow" th:text="#{ownerDirectory}">Owner directory</span><h1 th:text="#{findOwners}">Find Owners</h1><p th:text="#{findOwnersDescription}">Search by last name to open an owner’s complete care record.</p></div>
    <a class="btn btn-primary" th:href="@{/owners/new}"><i class="fa fa-plus" aria-hidden="true"></i><span th:text="#{addOwner}">Add Owner</span></a>
  </div>

  <section class="search-card" aria-labelledby="owner-search-title">
    <div class="search-card-icon" aria-hidden="true"><i class="fa fa-search"></i></div>
    <div class="search-card-content">
      <h2 id="owner-search-title" th:text="#{searchOwnerRecords}">Search owner records</h2>
      <p th:text="#{searchOwnerHint}">Leave the field blank to see every owner.</p>
      <form th:object="${owner}" th:action="@{/owners}" method="get" id="search-owner-form" role="search">
        <div th:class="${'search-control' + (#fields.hasAnyErrors() ? ' has-error' : '')}" id="lastNameGroup">
          <label for="lastName" th:text="#{lastName}">Last name</label>
          <div class="search-input-wrap"><i class="fa fa-user-o" aria-hidden="true"></i><input class="form-control" th:field="*{lastName}" maxlength="80" autocomplete="family-name" th:placeholder="#{lastNamePlaceholder}" /></div>
          <div class="field-error" th:if="${#fields.hasAnyErrors()}" role="alert"><p th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</p></div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fa fa-search" aria-hidden="true"></i><span th:text="#{findOwner}">Find Owner</span></button>
      </form>
    </div>
  </section>

  <div class="support-note"><i class="fa fa-lightbulb-o" aria-hidden="true"></i><p><strong th:text="#{searchTip}">Search tip</strong><span th:text="#{searchTipText}"> You can enter the first few letters of a last name.</span></p></div>
</body>

</html>
